name: Flutter app

on:
  push:
    paths:
      - "apps/nutrition-app/**"
      - ".github/workflows/flutter-app.yml"
  pull_request:
    paths:
      - "apps/nutrition-app/**"
      - ".github/workflows/flutter-app.yml"

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nutrition-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
