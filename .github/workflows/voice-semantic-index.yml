name: Voice Semantic Index

on:
  schedule:
    # Gemini daily quotas reset at midnight Pacific time. Keep 100 of the
    # observed 1,000 free embedding requests available for rare live misses.
    - cron: "37 08 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum foods to embed in this run
        required: false
        default: "900"

permissions:
  contents: read

concurrency:
  group: voice-semantic-index
  cancel-in-progress: false

jobs:
  extend-index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENNUTRI_APP_SUPABASE_URL: ${{ secrets.OPENNUTRI_VOICE_SUPABASE_URL }}
      OPENNUTRI_APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OPENNUTRI_VOICE_SUPABASE_SERVICE_ROLE_KEY }}
      OPENNUTRI_CORE_VERSION: "0.3.0"
      OPENNUTRI_SEMANTIC_INDEX_VERSION: core-0.3.0-gemini-embedding-2-768
      OPENNUTRI_EXPECTED_SEARCHABLE_FOODS: "13537"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check current index count
        id: index
        shell: bash
        run: |
          if [[ -z "$OPENNUTRI_APP_SUPABASE_URL" || -z "$OPENNUTRI_APP_SUPABASE_SERVICE_ROLE_KEY" || -z "$GEMINI_API_KEY" ]]; then
            echo "Voice index secrets are not configured" >&2
            exit 1
          fi
          headers="$(mktemp)"
          curl --silent --show-error --fail \
            --output /dev/null \
            --dump-header "$headers" \
            --header "apikey: $OPENNUTRI_APP_SUPABASE_SERVICE_ROLE_KEY" \
            --header "authorization: Bearer $OPENNUTRI_APP_SUPABASE_SERVICE_ROLE_KEY" \
            --header "Prefer: count=exact" \
            --header "Range: 0-0" \
            "$OPENNUTRI_APP_SUPABASE_URL/rest/v1/food_embeddings?select=food_id&core_version=eq.$OPENNUTRI_CORE_VERSION&index_version=eq.$OPENNUTRI_SEMANTIC_INDEX_VERSION"
          content_range="$(awk 'BEGIN{IGNORECASE=1} /^content-range:/ {gsub("\r", ""); print $2}' "$headers")"
          rm "$headers"
          count="${content_range##*/}"
          if [[ ! "$count" =~ ^[0-9]+$ ]]; then
            echo "Could not read the semantic index count" >&2
            exit 1
          fi
          echo "Current semantic index: $count/$OPENNUTRI_EXPECTED_SEARCHABLE_FOODS"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if (( count < OPENNUTRI_EXPECTED_SEARCHABLE_FOODS )); then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.index.outputs.needs_build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/voice-api/requirements.txt

      - name: Install dependencies
        if: steps.index.outputs.needs_build == 'true'
        run: python3 -m pip install -r services/voice-api/requirements.txt

      - name: Restore verified Core artifact
        if: steps.index.outputs.needs_build == 'true'
        uses: actions/cache@v4
        with:
          path: services/voice-api/data/opennutri-core.sqlite
          key: voice-core-usda-v0.3.0

      - name: Fetch and verify Core v0.3.0
        if: steps.index.outputs.needs_build == 'true'
        working-directory: services/voice-api
        run: python3 scripts/fetch_core_release.py

      - name: Extend the free semantic index
        if: steps.index.outputs.needs_build == 'true'
        working-directory: services/voice-api
        env:
          BUILD_LIMIT: ${{ github.event.inputs.limit || '900' }}
        run: |
          python3 scripts/build_embeddings.py \
            --batch-size 100 \
            --limit "$BUILD_LIMIT" \
            --min-interval-seconds 65
