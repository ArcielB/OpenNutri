name: Voice API Tests

on:
  push:
    branches: [main]
    paths:
      - "services/voice-api/**"
      - ".github/workflows/voice-api-tests.yml"
  pull_request:
    paths:
      - "services/voice-api/**"
      - ".github/workflows/voice-api-tests.yml"

jobs:
  voice-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/voice-api/requirements-dev.txt

      - name: Install dependencies
        run: python3 -m pip install -r services/voice-api/requirements-dev.txt

      - name: Run voice resolver tests
        working-directory: services/voice-api
        run: python3 -m pytest tests -q
