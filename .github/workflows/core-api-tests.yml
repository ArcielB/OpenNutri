name: Core API Tests

on:
  push:
    branches: [main]
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-tests.yml"
  pull_request:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-tests.yml"

jobs:
  core-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/requirements-dev.txt

      - name: Install dependencies
        run: python3 -m pip install -r services/core-api/requirements-dev.txt

      - name: Run Core API tests
        env:
          OPENNUTRI_SKIP_REAL_RELEASE_TEST: "1"
        working-directory: services/core-api
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
