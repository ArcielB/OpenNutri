name: Daily OpenNutri Ops

on:
  schedule:
    # GitHub cron is UTC. Run a small resumable tick every 5 minutes.
    # A serialized controller creates bounded Gemma work; workers only drain queued model tasks.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "Number of worker jobs to run for this manual dispatch"
        required: false
        default: "5"

jobs:
  refill-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: daily-ops-refill-controller
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Cache controller model data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: opennutri-controller-hf-${{ runner.os }}-${{ hashFiles('services/data-pipeline/requirements.txt') }}
          restore-keys: |
            opennutri-controller-hf-${{ runner.os }}-

      - name: Install CPU-only torch
        # sentence-transformers pulls torch, which by default drags the full
        # NVIDIA CUDA wheel set (~3-4 GB) onto this CPU-only runner. Installing
        # the CPU build first satisfies the dependency with ~10x less download.
        run: python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: python3 -m pip install -r services/data-pipeline/requirements.txt

      - name: Run refill controller
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENNUTRI_STORE_PDFS_IN_SUPABASE: "0"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          summary="$(
            python3 services/data-pipeline/scripts/daily_ops_orchestrator.py \
              --json-summary \
              --controller-only \
              --tick-mode \
              --target-open 50 \
              --stage-rpm gemma_proof_extraction_v1=20,gemini_flash_lite_triage_v1=20,gemini_flash_db_payload_v2=15 \
              --max-wallclock-minutes 75 \
              --crawler-max-wallclock-seconds 2400 \
              --screening-daily-target 1500 \
              --screening-active-target 150 \
              --triage-daily-target 500 \
              --extraction-daily-target 250 \
              --screening-refill-batch-en 30 \
              --screening-refill-chunk-en 30 \
              --screening-prefill-stall-limit 3 \
              --paper-bucket-soft-limit-mb 0 \
              --skip-storage-cleanup \
              --refill-step-tr 0 \
              | tee /tmp/opennutri-daily-ops-controller.jsonl \
              | tail -n 1
          )"
          python3 -c 'import json, sys; data=json.loads(sys.argv[1]); screening=(data.get("stage_summaries") or {}).get(data.get("screening_stage_key"), {}); storage=data.get("storage_cleanup") or {}; print("Daily ops controller mode={mode} stopped_reason={reason} active_target={active_target} active_count={active_count} refills={refills} requested_en={requested_en} storage_remaining_bytes={storage_remaining} storage_soft_limit_exceeded={storage_exceeded}".format(mode=data.get("mode", "controller"), reason=data.get("stopped_reason", ""), active_target=screening.get("active_target", 0), active_count=screening.get("active_count", 0), refills=screening.get("refill_cycles", 0), requested_en=screening.get("refill_requested_en", 0), storage_remaining=storage.get("remaining_bytes_after_cleanup"), storage_exceeded=data.get("storage_soft_limit_exceeded", False)))' "$summary"

      - name: Upload controller log artifact
        # The orchestrator's stdout (crawler/upload prints + JSONL summaries) is
        # piped through `tail -n 1` above, so this file is the only place the
        # full crawl/refill detail survives.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ops-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/opennutri-daily-ops-controller.jsonl
          if-no-files-found: ignore
          retention-days: 7

  drain-workers:
    # Runs in parallel with refill-controller (no longer gated on it). There is always a
    # queued Gemma/downstream backlog to drain, so workers must not idle through the controller's
    # 12-23 min crawl/refill phase, and draining must continue even if the controller job fails.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]

    steps:
      - name: Check out repository
        if: ${{ github.event_name != 'workflow_dispatch' || matrix.worker <= fromJSON(inputs.workers) }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event_name != 'workflow_dispatch' || matrix.worker <= fromJSON(inputs.workers) }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements-worker.txt

      - name: Install system dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || matrix.worker <= fromJSON(inputs.workers) }}
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || matrix.worker <= fromJSON(inputs.workers) }}
        run: python3 -m pip install -r services/data-pipeline/requirements-worker.txt

      - name: Run drain-only daily ops tick
        if: ${{ github.event_name != 'workflow_dispatch' || matrix.worker <= fromJSON(inputs.workers) }}
        env:
          OPENNUTRI_OPS_WORKER_INDEX: ${{ matrix.worker }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENNUTRI_STORE_PDFS_IN_SUPABASE: "0"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_REQUEST_TIMEOUT_SECONDS: "300"
          AI_MODEL_TASK_TIMEOUT_SECONDS: "300"
          AI_STAGE_MAX_TASK_ATTEMPTS: "2"
          GEMMA_STAGE_TEXT_LIMIT_CHARS: "24000"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          # Daily targets are safety ceilings, not expected throughput: the real
          # stop condition is the Gemini API's own daily quota, detected by the
          # orchestrator as a 429 with zero successful calls in the window
          # (daily_quota_exhausted). Raising a target lets the pipeline use
          # whatever quota Google actually grants instead of self-throttling.
          summary="$(
            python3 services/data-pipeline/scripts/daily_ops_orchestrator.py \
              --json-summary \
              --drain-only \
              --tick-mode \
              --interleave-extraction \
              --target-open 50 \
              --stage-rpm gemma_proof_extraction_v1=20,gemini_flash_lite_triage_v1=20,gemini_flash_db_payload_v2=15 \
              --max-wallclock-minutes 0 \
              --screening-daily-target 1500 \
              --screening-tick-tasks 20 \
              --triage-daily-target 500 \
              --triage-tick-tasks 10 \
              --extraction-daily-target 250 \
              --extraction-tick-tasks 5 \
              --refill-step-tr 0 \
              | tee /tmp/opennutri-daily-ops-worker.jsonl \
              | tail -n 1
          )"
          python3 -c 'import json, sys; data=json.loads(sys.argv[1]); daily=data.get("daily_completed") or {}; print("Daily ops worker mode={mode} stopped_reason={reason} daily_completed={daily} screened={screened} routed_to_gemini={routed} gemini_used={gemini} human_ready={human} quota_exhausted_stages={quota}".format(mode=data.get("mode", "drain"), reason=data.get("stopped_reason", ""), daily=daily, screened=data.get("screened", 0), routed=data.get("routed_to_gemini", 0), gemini=data.get("gemini_used", 0), human=data.get("human_ready", 0), quota=data.get("quota_exhausted_stages", [])))' "$summary"

      - name: Upload worker log artifact
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || matrix.worker <= fromJSON(inputs.workers)) }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-ops-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/opennutri-daily-ops-worker.jsonl
          if-no-files-found: ignore
          retention-days: 7
