name: Daily OpenNutri Ops

on:
  schedule:
    # GitHub cron is UTC. The exact runner start time is not important;
    # the controller loops internally until it reaches a terminal quota/config stop.
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: opennutri-daily-ops
  cancel-in-progress: false

jobs:
  daily-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Cache pipeline data
        uses: actions/cache@v4
        with:
          path: |
            services/data-pipeline/data
            ~/.cache/huggingface
          key: opennutri-pipeline-${{ github.run_id }}
          restore-keys: |
            opennutri-pipeline-

      - name: Install Python dependencies
        run: python3 -m pip install -r services/data-pipeline/requirements.txt

      - name: Run quota-draining daily ops controller
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_REQUEST_TIMEOUT_SECONDS: "180"
          AI_MODEL_TASK_TIMEOUT_SECONDS: "180"
          AI_STAGE_MAX_TASK_ATTEMPTS: "2"
          GEMMA_STAGE_TEXT_LIMIT_CHARS: "60000"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          summary="$(
            python3 services/data-pipeline/scripts/daily_ops_orchestrator.py \
              --json-summary \
              --target-open 50 \
              --stage-rpm gemma_proof_extraction_v1=15,gemini_flash_db_payload_v2=15 \
              --quota-cooldown-seconds 65 \
              --max-wallclock-minutes 330 \
              --screening-queue-low-watermark 30 \
              --screening-refill-batch-en 75 \
              --screening-refill-chunk-en 5 \
              --refill-step-tr 0 \
              | tee /tmp/opennutri-daily-ops-last.jsonl \
              | tail -n 1
          )"
          python3 -c 'import json, sys; data=json.loads(sys.argv[1]); print("Daily ops stopped_reason={reason} screened={screened} routed_to_gemini={routed} gemini_used={gemini} human_ready={human} quota_exhausted_stages={quota}".format(reason=data.get("stopped_reason", ""), screened=data.get("screened", 0), routed=data.get("routed_to_gemini", 0), gemini=data.get("gemini_used", 0), human=data.get("human_ready", 0), quota=data.get("quota_exhausted_stages", [])))' "$summary"
