name: Daily OpenNutri Ops

on:
  schedule:
    # GitHub cron is UTC. The gate step below keeps the 00:15
    # America/Los_Angeles start in both PDT and PST, with tolerance for runner delay.
    - cron: "15 7,8 * * *"
  workflow_dispatch:

concurrency:
  group: opennutri-daily-ops
  cancel-in-progress: false

jobs:
  daily-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Gate scheduled reset start
        id: reset_window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pacific_hour="$(TZ=America/Los_Angeles date +%H)"
          pacific_minute="$(TZ=America/Los_Angeles date +%M)"
          pacific_time="${pacific_hour}:${pacific_minute}"
          case "$pacific_time" in
            00:1[5-9]|00:[2-5][0-9])
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Skipping scheduled run outside Gemini reset start window: $pacific_time America/Los_Angeles"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out repository
        if: steps.reset_window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.reset_window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.txt

      - name: Install system dependencies
        if: steps.reset_window.outputs.should_run == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Cache pipeline data
        if: steps.reset_window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            services/data-pipeline/data
            ~/.cache/huggingface
          key: opennutri-pipeline-${{ github.run_id }}
          restore-keys: |
            opennutri-pipeline-

      - name: Install Python dependencies
        if: steps.reset_window.outputs.should_run == 'true'
        run: python3 -m pip install -r services/data-pipeline/requirements.txt

      - name: Run recursive daily ops controller
        if: steps.reset_window.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          while true; do
            summary="$(
              python3 services/data-pipeline/scripts/daily_ops_orchestrator.py \
                --json-summary \
                --target-open 50 \
                --max-cycles 8 \
                --max-ai-tasks 5 \
                | tee /tmp/opennutri-daily-ops-last.jsonl \
                | tail -n 1
            )"
            reason="$(python3 -c 'import json, sys; print(json.loads(sys.argv[1]).get("stopped_reason", ""))' "$summary")"
            terminal="$(python3 -c 'import json, sys; print("true" if json.loads(sys.argv[1]).get("terminal") else "false")' "$summary")"
            echo "Daily ops iteration stopped_reason=$reason terminal=$terminal"

            if [ "$terminal" = "true" ]; then
              break
            fi

            echo "Non-terminal stop; sleeping 5 minutes before the next recursive iteration."
            sleep 300
          done
