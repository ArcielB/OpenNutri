name: Tests

on:
  push:
    branches: [main]
    paths:
      - "services/data-pipeline/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "services/data-pipeline/**"
      - ".github/workflows/tests.yml"

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements-worker.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        # Worker requirements (supabase + google-generativeai) are enough for
        # the test suite; the heavy sentence-transformers stack is not needed.
        run: |
          python3 -m pip install -r services/data-pipeline/requirements-worker.txt
          python3 -m pip install pytest

      - name: Run test suite
        run: python3 -m pytest services/data-pipeline/tests/ -q
